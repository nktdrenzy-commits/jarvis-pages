name: Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: '版本类型'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch  # 补丁版本 v0.1.x（小改动、bug修复）
          - minor  # 次版本 v0.x.0（新功能，向后兼容）
          - major  # 主版本 x.0.0（破坏性变更）

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and create changelog
        id: version
        run: |
          set -e

          CURRENT_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Current version: $CURRENT_VERSION"

          # 解析主版本号、次版本号、补丁版本号
          CURRENT_MAJOR=$(echo "$CURRENT_VERSION" | sed 's/v//' | cut -d. -f1)
          CURRENT_MINOR=$(echo "$CURRENT_VERSION" | sed 's/v//' | cut -d. -f2)
          CURRENT_PATCH=$(echo "$CURRENT_VERSION" | sed 's/v//' | cut -d. -f3)

          VERSION_TYPE=${{ inputs.version_type }}

          if [ "$VERSION_TYPE" = "major" ]; then
            NEW_MAJOR=$((CURRENT_MAJOR + 1))
            NEW_MINOR=0
            NEW_PATCH=0
          elif [ "$VERSION_TYPE" = "minor" ]; then
            NEW_MAJOR=$CURRENT_MAJOR
            NEW_MINOR=$((CURRENT_MINOR + 1))
            NEW_PATCH=0
          else
            NEW_MAJOR=$CURRENT_MAJOR
            NEW_MINOR=$CURRENT_MINOR
            NEW_PATCH=$((CURRENT_PATCH + 1))
          fi

          NEW_VERSION="v${NEW_MAJOR}.${NEW_MINOR}.${NEW_PATCH}"
          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

          # 生成发布说明
          RELEASE_NOTES=$(cat << EOF
          ## 🎉 $NEW_VERSION 发布

          **版本类型：** $VERSION_TYPE
          **发布日期：** $(date '+%Y-%m-%d')

          ### 变更内容

          $(git log --oneline $CURRENT_VERSION..HEAD 2>/dev/null | sed 's/^[a-f0-9]* /- /')

          ---
          *Generated by Jarvis Release Workflow*
          EOF
          )
          echo "release_notes=$RELEASE_NOTES" >> $GITHUB_OUTPUT

      - name: Create tag and update CHANGELOG
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          TAG_NAME="v$(echo $NEW_VERSION | sed 's/v//')"

          # 更新 CHANGELOG.md 顶部
          DATE=$(date '+%Y-%m-%d')
          CHANGELOG_ENTRY="## [$NEW_VERSION] - $DATE

          ### Features & Fixes

          $(git log --oneline --format='- %s' HEAD~10..HEAD 2>/dev/null || echo '- Initial release')

          ---"
          python3 -c "
          with open('CHANGELOG.md', 'r') as f:
              content = f.read()
          entry = '''## [$NEW_VERSION] - $DATE

          ### Features & Fixes

          $(git log --oneline --format='- %s' HEAD~10..HEAD 2>/dev/null || echo '- Initial release')

          ---

          '''
          # Insert after the first H2 (## [Unreleased]) line
          lines = content.split('\n')
          insert_idx = None
          for i, line in enumerate(lines):
              if line.strip().startswith('## ['):
                  insert_idx = i + 1
                  break
          if insert_idx:
              lines.insert(insert_idx, '')
              for j, el in enumerate(entry.split('\n')[::-1]):
                  lines.insert(insert_idx, el)
          with open('CHANGELOG.md', 'w') as f:
              f.write('\n'.join(lines))
          print('CHANGELOG.md updated')
          "

          # Commit CHANGELOG
          git config user.name "Jarvis CI"
          git config user.email "ci@jarvis.pages"
          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG for $TAG_NAME"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.new_version }}
          name: ${{ steps.version.outputs.new_version }}
          body: ${{ steps.version.outputs.release_notes }}
          draft: false
          prerelease: ${{ inputs.version_type == 'major' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push new tag
        run: |
          TAG_NAME="v$(echo '${{ steps.version.outputs.new_version }}' | sed 's/v//')"
          git push origin $TAG_NAME
